# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Local hooks that call helper scripts
  - repo: local
    hooks:
      - id: enforce-style
        name: Enforce Python Style
        entry: bash helpers/enforce-style.sh
        language: system
        types: [python]
        pass_filenames: true
        verbose: true
      
      - id: validate-release
        name: Validate release package
        entry: ./helpers/validate-package.sh
        language: script
        pass_filenames: false
        stages: [manual]
        verbose: true