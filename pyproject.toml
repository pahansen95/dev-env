[project]
name = "dev-env"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2.1",
    "docker>=7.1.0",
    "pydantic>=2.11.5",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.11.11",
    "types-docker>=7.1.0.20250523",
]

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
# Enable pycodestyle warnings (E) and errors (W), pyflakes (F)
select = ["E", "W", "F"]
# Ignore line length since we set it above
ignore = ["E501"]

[tool.ruff.lint.isort]
# Group imports like YAPF: standard library → third-party → local
section-order = ["standard-library", "third-party", "local-folder"]
combine-as-imports = true
