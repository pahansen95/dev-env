[project]
name = "dev-env"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []
description = "Zero-dependency development environment management tool"
readme = "README.md"
license = "MIT"

[project.scripts]
dev-env = "dev_env.cli:main"

[dependency-groups]
build = [
    "build>=1.2.2.post1",
]
dev = [
    "mcp[cli]>=1.9.2",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.11.11",
    "types-docker>=7.1.0.20250523",
]

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
# Enable pycodestyle warnings (E) and errors (W), pyflakes (F)
select = ["E", "W", "F"]
# Ignore line length since we set it above
ignore = ["E501"]

[tool.ruff.lint.isort]
# Group imports like YAPF: standard library → third-party → local
section-order = ["standard-library", "third-party", "local-folder"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=src/dev_env",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=85"
]
markers = [
    "slow: marks tests as slow (may require Docker)",
    "integration: marks tests as integration tests", 
    "unit: marks tests as unit tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
